apiVersion: apps/v1
kind: Deployment
metadata:
  name: humanqa-site
  labels:
    app.kubernetes.io/name: humanqa-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: humanqa-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: humanqa-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          image: ghcr.io/hotragn/humanqa-site:0.1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: humanqa-site
  labels:
    app.kubernetes.io/name: humanqa-site
spec:
  selector:
    app.kubernetes.io/name: humanqa-site
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
