name: Bug report
description: Report a reproducible HumanQA defect with synthetic or sanitized evidence.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, customer data, private URLs, DOM, traces, screenshots, or PRDs. Use the private security form for sensitive exposure.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What did HumanQA do, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include command, fixture mode, pack path, and minimal steps.
      placeholder: pnpm humanqa audit http://127.0.0.1:4173 --journey packs/journeys/example.yaml
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit }
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, pnpm, OS, browser, viewport, safe mode, redaction, screenshots, and offline state.
    validations: { required: true }
  - type: input
    id: rule
    attributes:
      {
        label: Finding rule or command,
        description: Include the rule ID if the defect concerns a finding.
      }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used synthetic or sanitized data and reviewed every attached artifact.
          required: true
