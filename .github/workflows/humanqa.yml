name: HumanQA

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start deterministic fixture
        run: pnpm --filter @humanqa/demo-dashboard dev:fixed > humanqa-demo.log 2>&1 &
      - name: Wait for fixture
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify quality contract
        run: pnpm humanqa verify --config humanqa.example.yml
      - name: Upload local evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanqa-report
          path: humanqa-output/
          if-no-files-found: error
          retention-days: 7
