kind: journey
id: password-reset
name: Password-reset entry point
description: Verify that a declared password-reset entry point is present without submitting personal data.
author: HumanQA maintainers
version: 0.1.0
compatibility: ">=0.1.0 <1.0.0"
tags: [authentication, recovery, review-only]
definition:
  criticality: 4
  steps:
    - action: goto
      path: /login
    - action: assert-visible
      role: heading
      name: Welcome back
      criterion: User can reach account recovery context
      description: Verify the authentication context loads
    - action: keyboard-reachable
      selector: "#login-email"
      criterion: Recovery context begins with a keyboard-reachable identity field
